name: Deploy to itch.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à publier (vide = latest)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    env:
      # Valeurs par défaut déduites du repo ; surchargeables par des variables
      # de repo (Settings > Secrets and variables > Actions > Variables)
      ITCH_USER: ${{ vars.ITCH_USER || github.repository_owner }}
      ITCH_GAME: ${{ vars.ITCH_GAME || github.event.repository.name }}

    steps:
      - name: Déterminer la release
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Release ciblée : $TAG"

      - name: Télécharger le zip de la release
        run: |
          mkdir -p dist
          gh release download "${{ steps.rel.outputs.tag }}" \
            --repo ${{ github.repository }} \
            --pattern '*.zip' \
            --dir dist
          ls -lh dist

      - name: Installer butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"

      - name: Push vers itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler -V
          ZIP=$(ls dist/*.zip | head -n1)
          echo "Envoi de $ZIP vers $ITCH_USER/$ITCH_GAME:$CHANNEL"
          butler push "$ZIP" "$ITCH_USER/$ITCH_GAME:$CHANNEL" --userversion "${{ steps.rel.outputs.version }}"
          butler status "$ITCH_USER/$ITCH_GAME"
