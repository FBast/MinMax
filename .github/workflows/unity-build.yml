# À placer dans .github/workflows/unity-build.yml
name: Unity Build (self-hosted)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de la release (ex: 0.1.0). Vide = v0.0.<numero de run>"
        required: false
        default: ""
      prerelease:
        description: "Marquer la release comme pre-release"
        type: boolean
        default: true

permissions:
  contents: write   # nécessaire pour créer le tag et la release

jobs:
  build:
    runs-on: [self-hosted, windows]
    timeout-minutes: 90
    env:
      BUILD_TARGET: StandaloneWindows64   # ou Android, StandaloneLinux64, WebGL...
      # Pour Android signé, décommente et crée les secrets :
      # ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      # ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          clean: false   # IMPORTANT : garde le dossier Library entre deux builds

      - name: Build Unity
        shell: powershell
        run: |
          $version = (Select-String -Path ProjectSettings/ProjectVersion.txt -Pattern '^m_EditorVersion: (.+)$').Matches[0].Groups[1].Value.Trim()
          $unity = "C:\Program Files\Unity\Hub\Editor\$version\Editor\Unity.exe"
          if (-not (Test-Path $unity)) { throw "Unity $version introuvable sur le runner : installe-la via le Hub" }

          Remove-Item -Recurse -Force Build -ErrorAction SilentlyContinue
          Remove-Item -Force build.log -ErrorAction SilentlyContinue

          $unityArgs = @(
            '-batchmode', '-nographics', '-quit',
            '-projectPath', "`"$PWD`"",
            '-buildTarget', $env:BUILD_TARGET,
            '-executeMethod', 'BuildScript.Build',
            '-customBuildPath', 'Build',
            '-logFile', 'build.log'
          )

          Write-Host "Unity $version -> $env:BUILD_TARGET"
          $p = Start-Process -FilePath $unity -ArgumentList $unityArgs -Wait -PassThru -NoNewWindow
          Get-Content build.log -Tail 150 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Build Unity échoué (code $($p.ExitCode)) - voir l'artefact build-log" }

      - name: Zip du build
        id: package
        shell: powershell
        run: |
          $tag = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "0.0.${{ github.run_number }}" }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
 
          $zip = "MinMax-$env:BUILD_TARGET-$tag.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path Build\* -DestinationPath $zip
 
          "tag=$tag"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=$zip"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
 
      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip }}

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.BUILD_TARGET }}
          path: Build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
